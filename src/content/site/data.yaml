site:
  name: LunaDeerMC
  slogan: To the moon, to the dream, to the future!
  url: https://mc.lunadeer.cn
  defaultLocale: zh-CN
  locales:
    - zh-CN
    - en
  github: https://github.com/LunaDeerMC
  email: support@lunadeermc.dev
  logo: /assets/lunadeermc-brand-logo.png
  scenes:
    light:
      sky: /assets/scenes/sunlit-pastoral-hero.png
      foreground: /assets/scenes/sunlit-pastoral-hero.png
      layers:
        sky: /assets/scenes/light/sky.webp
        distance: /assets/scenes/light/distance.webp
        settlement: /assets/scenes/light/settlement.webp
        foreground: /assets/scenes/light/foreground.webp
      alt:
        zh-CN: 阳光下的 Minecraft 牧场、麦田、农舍与远山
        en: A sunlit Minecraft pastoral scene with fields, farms, and distant mountains
    dark:
      sky: /assets/scenes/redstone-dusk-hero.png
      foreground: /assets/scenes/redstone-dusk-hero.png
      layers:
        sky: /assets/scenes/dark/sky.webp
        distance: /assets/scenes/dark/distance.webp
        settlement: /assets/scenes/dark/settlement.webp
        foreground: /assets/scenes/dark/foreground.webp
      alt:
        zh-CN: 黄昏中的 Minecraft 红石工坊、灯火与远山
        en: A redstone workshop and developer settlement at Minecraft dusk
  channels:
    community:
      - name: QQ 群
        nameEn: QQ community
        description:
          zh-CN: 加入公开社区，参与讨论、获取公告并分享使用反馈。
          en: Join the public community for discussion, announcements, and feedback.
        icon: MessageCircle
        url: https://github.com/LunaDeerMC
      - name: GitHub 主页
        nameEn: GitHub organization
        description:
          zh-CN: 查看开源作品、提交 Issue，并参与公开协作。
          en: Browse open-source work, file issues, and participate in public collaboration.
        icon: Github
        url: https://github.com/LunaDeerMC
      - name: 支持邮箱
        nameEn: Support email
        description:
          zh-CN: 通过邮件处理不适合在公开社区讨论的支持事项。
          en: Use email for support matters that do not belong in a public channel.
        icon: Mail
        url: mailto:support@lunadeermc.dev
    obtain:
      - name: 免费作品与社区版本
        nameEn: Free work and community editions
        description:
          zh-CN: 从作品介绍页进入公开下载渠道，先阅读对应文档再开始配置。
          en: Start from a work page, use its public download channel, and read the docs first.
        icon: Download
        url: /works
      - name: 授权权益与退款政策
        nameEn: Licensing and refund policy
        description:
          zh-CN: 购买、交付和退款由第三方平台处理，详细边界见通用文档。
          en: Purchases, delivery, and refunds are handled by third-party platforms; see the policy docs.
        icon: KeyRound
        url: /docs/general/legal/obtain-and-refund
    sponsor:
      - name: 赞助项目发展
        nameEn: Sponsor project development
        description:
          zh-CN: 用可持续的方式支持维护、基础设施和新作品探索。
          en: Support maintenance, infrastructure, and exploration of new work.
        icon: Heart
        url: https://github.com/sponsors/LunaDeerMC
      - name: 优先测试与反馈
        nameEn: Early testing and feedback
        description:
          zh-CN: 赞助权益以公开说明为准，不与付费作品授权混为一谈。
          en: Sponsor benefits follow the published scope and are separate from work licenses.
        icon: Gift
        url: /docs/general/getting-started
    legal:
      - name: 隐私政策
        nameEn: Privacy policy
        description:
          zh-CN: 了解站点、第三方平台与公开联系渠道如何处理信息。
          en: Learn how the site, third-party platforms, and public contact channels handle information.
        icon: FileText
        url: /docs/general/legal/privacy
      - name: 使用条款
        nameEn: Terms of use
        description:
          zh-CN: 了解作品、文档、站点内容和外部渠道的使用边界。
          en: Understand the boundaries for using our work, docs, site, and external channels.
        icon: ScrollText
        url: /docs/general/legal/terms
      - name: 获取、退款与免责声明
        nameEn: Obtain, refunds, and disclaimers
        description:
          zh-CN: 查看第三方获取平台、退款流程和责任边界的完整说明。
          en: Read the full explanation of third-party acquisition, refunds, and liability boundaries.
        icon: CircleAlert
        url: /docs/general/legal/obtain-and-refund
  philosophy:
    - title:
        zh-CN: 实用至上
        en: Practical first
      description:
        zh-CN: 从真实需求出发，先解决问题，再决定是否需要更多结构。
        en: Start with a real need, solve it clearly, then decide whether more structure is needed.
      icon: Heart
    - title:
        zh-CN: 稳定可靠
        en: Steady and reliable
      description:
        zh-CN: 长期维护与向后兼容比短期的功能数量更值得被认真对待。
        en: Long-term maintenance and compatibility matter more than short-term feature count.
      icon: ShieldCheck
    - title:
        zh-CN: 开放协作
        en: Open collaboration
      description:
        zh-CN: 把源码、文档和反馈路径留在公开空间，让更多人可以一起改进。
        en: Keep source, docs, and feedback paths open so more people can improve the work.
      icon: Users
  members:
    - name: Luna
      role:
        zh-CN: 核心开发者
        en: Core developer
      description:
        zh-CN: 负责服务端架构、系统设计与长期维护。
        en: Works on server architecture, systems, and long-term maintenance.
      github: https://github.com/lunamc
    - name: Deer
      role:
        zh-CN: 插件开发者
        en: Plugin developer
      description:
        zh-CN: 关注玩家体验、交互细节和社区反馈。
        en: Focuses on player experience, interaction details, and community feedback.
      github: https://github.com/deermc
    - name: Maple
      role:
        zh-CN: 构建与工具
        en: Build and tools
      description:
        zh-CN: 让开发工作流更容易运行、调试和复用。
        en: Makes development workflows easier to run, debug, and reuse.
      github: https://github.com/maplemc
