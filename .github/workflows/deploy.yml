name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and upload site
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: pnpm@11.9.0
          build-cmd: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Refresh Tencent EdgeOne CDN cache
        env:
          EO_SECRETID: ${{ secrets.EO_SECRETID }}
          EO_SECRETKEY: ${{ secrets.EO_SECRETKEY }}
          EO_PURGE_DOMAIN: mc.lunadeer.cn
          # Optional: set as a repository variable to skip zone auto-discovery.
          EO_ZONE_ID: ${{ vars.EO_ZONE_ID }}
          # Optional: "invalidate" (default) or "delete".
          EO_PURGE_METHOD: ${{ vars.EO_PURGE_METHOD }}
        run: node scripts/refresh-edgeone-cache.mjs
