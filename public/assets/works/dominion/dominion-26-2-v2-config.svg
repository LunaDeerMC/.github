      <text x="112" y="990">residence-migration: false</text><text x="112" y="1018">admin-bypass: true</text>
      <text x="112" y="1046" fill="#93c5fd">group-title:</text><text x="136" y="1074">enable: false</text><text x="136" y="1102">prefix: '['</text><text x="136" y="1130">suffix: ']'</text>
      <text x="112" y="1158" fill="#93c5fd">external-links:</text><text x="136" y="1186">command-help: ''</text><text x="136" y="1214">documentation: https://dominion.lunadeer.cn/notes/doc/player/</text>
      <text x="112" y="1242">fly-permission-nodes:</text><text x="136" y="1270">- essentials.fly</text><text x="136" y="1298">- cmi.command.fly</text><text x="136" y="1326">- domfly.use</text>
      <text x="112" y="1354">check-update: true</text><text x="112" y="1382">debug: false</text><text x="112" y="1410">timer: false</text>
