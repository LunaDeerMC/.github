    <g fill="#e5e7eb">
      <text x="112" y="122" fill="#fbbf24">version: 4</text>
      <text x="112" y="150" fill="#93c5fd">database:</text>
      <text x="136" y="178">type: sqlite</text><text x="136" y="206">host: localhost</text><text x="136" y="234">port: '3306'</text><text x="136" y="262">database: dominion</text><text x="136" y="290">username: dominion</text><text x="136" y="318">password: dominion</text><text x="136" y="346">connection-pool-size: 10</text>
      <text x="112" y="374" fill="#93c5fd">multi-server:</text>
      <text x="136" y="402">enable: false</text><text x="136" y="430">server-name: server</text><text x="136" y="458">server-id: 1</text>
      <text x="112" y="486">language: zh_cn</text>
      <text x="112" y="514" fill="#93c5fd">ui:</text><text x="136" y="542">default: CHEST</text>
      <text x="112" y="570">auto-create-radius: 10</text><text x="112" y="598">auto-clean-after-days: 180</text><text x="112" y="626">server-spawn-protection-radius: 10</text><text x="112" y="654">minimum-dominion-distance: 0</text><text x="112" y="682">select-tool: ARROW</text><text x="112" y="710">info-tool: STRING</text>
      <text x="112" y="738" fill="#93c5fd">plugin-message:</text><text x="136" y="766">default-enter-message: '&amp;3{OWNER}: Welcome to {DOM}!'</text><text x="136" y="794">default-leave-message: '&amp;3{OWNER}: Leaving {DOM}...'</text><text x="136" y="822">no-permission-display-place: ACTION_BAR</text><text x="136" y="850">enter-leave-display-place: ACTION_BAR</text>
